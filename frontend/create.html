<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TASK MANAGER — Создать задачу</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-top: 0;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
        }
        .btn:hover {
            background: #218838;
        }
        .error-message {
            color: #dc3545;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">&larr; На главную</a>
        <h1>Создать задачу</h1>
        <form id="createForm">
            <div class="form-group">
                <label for="title">Название</label>
                <input type="text" id="title" name="title" required placeholder="Введите название задачи">
            </div>
            <div class="form-group">
                <label for="description">Описание</label>
                <textarea id="description" name="description" rows="3" placeholder="Введите описание задачи"></textarea>
            </div>
            <button type="submit" class="btn">Создать задачу</button>
            <div id="errorMsg" class="error-message"></div>
        </form>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/taskmanager';
        const form = document.getElementById('createForm');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.textContent = ''; // очищаем ошибки

            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();

            if (!title) {
                errorMsg.textContent = 'Название задачи обязательно';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/tasks`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ title, description })
                });

                if (!response.ok) {
                    // Попытка прочитать тело ошибки с сервера
                    let errorText = `Ошибка сервера: ${response.status}`;
                    try {
                        const errData = await response.json();
                        if (errData.error) errorText = errData.error;
                    } catch (e) {}
                    throw new Error(errorText);
                }

                const createdTask = await response.json();
                if (!createdTask.id) {
                    throw new Error('Сервер не вернул ID созданной задачи');
                }

                // Перенаправление на страницу редактирования с полученным id
                window.location.href = `edit.html?id=${createdTask.id}`;
            } catch (err) {
                errorMsg.textContent = err.message;
                console.error('Ошибка при создании задачи:', err);
            }
        });
    </script>
</body>
</html>
